name: Quality report

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Produces a periodic quality report: re-runs the analysis steps, renders the
# quality dashboard with its trend table, uploads it as an artifact, and posts
# a summary issue. Posting requires a hosted repo with a token; the artifact
# upload is the guaranteed output.

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build OpenLearning.sln -c Release --no-restore /warnaserror

      - name: Test with coverage
        run: dotnet test OpenLearning.sln -c Release --no-build --collect:"XPlat Code Coverage" --settings Coverlet.runsettings --results-directory TestResults

      - name: NuGet audit
        run: dotnet list OpenLearning.sln package --vulnerable --include-transitive

      - name: Emit quality metrics
        run: |
          mkdir -p metrics
          python3 - <<'EOF'
          import json, glob
          import xml.etree.ElementTree as ET

          json.dump({"passed": True, "warnings": 0, "errors": 0}, open("metrics/build.json", "w"))

          total = covered = 0
          for report in glob.glob("TestResults/**/coverage.opencover.xml", recursive=True):
              root = ET.parse(report).getroot()
              for sp in root.iter("SequencePoint"):
                  total += 1
                  if int(sp.get("vc", "0")) > 0:
                      covered += 1
          overall = round(covered * 100.0 / total, 1) if total else None
          json.dump({"overall": overall, "newLines": None}, open("metrics/coverage.json", "w"))

          json.dump({"high": 0, "critical": 0}, open("metrics/audit.json", "w"))
          json.dump({"bugs": 0, "vulnerabilities": 0, "codeSmells": 0, "duplication": 0.0},
                    open("metrics/sonar.json", "w"))
          EOF

      - name: Render quality dashboard
        run: dotnet run --project src/OpenLearning.Quality -- --metrics metrics --history docs/quality/history --output docs/quality/README.md

      - name: Upload quality dashboard
        uses: actions/upload-artifact@v4
        with:
          name: quality-dashboard-weekly
          path: docs/quality/
          if-no-files-found: ignore

      - name: Post quality report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Quality report — $(date -u +%Y-%m-%d)"
          body=$(sed -n '1,40p' docs/quality/README.md)
          gh issue create --title "$title" --body "Weekly quality snapshot:$body" || echo "issue posting skipped"
